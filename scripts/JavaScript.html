  /**
   * Wires up the Settings tab's photo folder form.
   * @return {void}
   */
  function setupPhotoFolderSettings() {
    document.getElementById('photoFolderForm').addEventListener('submit', handlePhotoFolderSubmit);
    document.getElementById('photoFolderClearBtn').addEventListener('click', handlePhotoFolderClearClick);
  }

  /**
   * Click handler for the "Clear Photo Folder" button: confirms, then
   * clears the saved folder setting. Existing photos already in Drive are
   * never touched — this only stops the app from uploading new ones
   * there and showing that folder as configured.
   * @return {void}
   */
  function handlePhotoFolderClearClick() {
    var btn = document.getElementById('photoFolderClearBtn');

    showConfirmModal(
      'Stop using this folder for catch photos? Photos already uploaded stay exactly where they are in Drive — ' +
      'this just clears the setting, so new catches won\'t have anywhere to save a photo until you set a folder again.',
      function () {
        setButtonBusy(btn);

        google.script.run
          .withSuccessHandler(function () {
            clearButtonBusy(btn);
            renderPhotoFolderStatus();
          })
          .withFailureHandler(function (err) {
            clearButtonBusy(btn);
            showInfoModal(err.message || String(err), 'Could not clear photo folder');
          })
          .setPhotoFolder('');
      }
    );
  }

  /**
   * Submit handler for the photo folder form: saves the pasted Drive
   * folder link/ID as the destination for future catch photos.
   * @param {SubmitEvent} e - Form submit event.
   * @return {void}
   */
  function handlePhotoFolderSubmit(e) {
    e.preventDefault();

    var input = document.getElementById('photoFolderInput');
    var submitBtn = e.target.querySelector('button[type="submit"]');
    setButtonBusy(submitBtn);

    google.script.run
      .withSuccessHandler(function () {
        clearButtonBusy(submitBtn);
        input.value = '';
        renderPhotoFolderStatus();
      })
      .withFailureHandler(function (err) {
        clearButtonBusy(submitBtn);
        showInfoModal(err.message || String(err), 'Could not save photo folder');
      })
      .setPhotoFolder(input.value.trim());
  }

  /**
   * Fetches and displays the currently configured photo-storage folder
   * (or a prompt to set one) on the Settings tab.
   * @return {void}
   */
  function renderPhotoFolderStatus() {
    var status = document.getElementById('photoFolderStatus');
    if (!status) return;

    status.textContent = 'Checking…';
    status.classList.remove('has-error');

    google.script.run
      .withSuccessHandler(function (info) {
        photoFolderConfigured = !!(info.folderId && !info.error);
        updateCatchPhotoFieldVisibility();
        // Shown whenever there's a saved folder id, even a broken one
        // (info.error), so a stale/inaccessible setting can be cleared.
        document.getElementById('photoFolderClearBtn').hidden = !info.folderId;

        if (info.error) {
          status.classList.add('has-error');
          status.textContent = info.error;
          return;
        }

        if (!info.folderId) {
          status.textContent = 'No folder set yet — photos can\'t be attached to catches until one is.';
          return;
        }

        status.innerHTML = 'Photos are saved to <a href="' + escapeHtml(info.folderUrl) +
          '" target="_blank" rel="noopener">' + escapeHtml(info.folderName) + '</a>.';
      })
      .withFailureHandler(function (err) {
        photoFolderConfigured = false;
        updateCatchPhotoFieldVisibility();
        document.getElementById('photoFolderClearBtn').hidden = true;
        status.classList.add('has-error');
        status.textContent = err.message || String(err);
      })
      .getPhotoFolderInfo();
  }

  /**
   * Shows or hides the Record Catch modal's photo field: there's no point
   * offering it (and it would just error on save) until a photo-storage
   * folder is configured on the Settings tab.
   * @return {void}
   */
  function updateCatchPhotoFieldVisibility() {
    var photoField = document.getElementById('catchPhotoField');
    if (!photoField) return;
    photoField.hidden = !photoFolderConfigured;
  }

  // ---------- VALIDATIONS TAB ----------
  // Manages the five Validations lists (Brands, Owners, Float Types, Fish
  // Types, Venues): add, rename, and delete. Deleting only removes the
  // value from its list — see filterVisibleItems/filterVisibleCatches for
  // how that hides (without deleting) anything that referenced it.

  var VALIDATION_FIELDS = [
    { key: 'venues', label: 'Venues' },
    { key: 'fishTypes', label: 'Fish Types' },
    { key: 'brands', label: 'Brands' },
    { key: 'owners', label: 'Owners' },
    { key: 'floatTypes', label: 'Float Types' }
  ];

  /**
   * Wires up the Validations tab via event delegation on its container,
   * since the add-forms and list items inside it are rebuilt every time
   * validations change.
   * @return {void}
   */
  function setupValidationsTab() {
    var container = document.getElementById('validationsGrid');
    container.addEventListener('submit', handleValidationAddSubmit);
    container.addEventListener('click', handleValidationListClick);
    document.getElementById('seedValidationsBtn').addEventListener('click', handleSeedValidationsClick);
  }

  /**
   * Click handler for the "Populate from existing data" button: runs the
   * one-time Validations backfill, then reports how many values were
   * added (if any) and reloads.
   * @return {void}
   */
  function handleSeedValidationsClick() {
    var btn = document.getElementById('seedValidationsBtn');
    setButtonBusy(btn);

    google.script.run
      .withSuccessHandler(function (result) {
        clearButtonBusy(btn);

        var added = result.added;
        var totalAdded = added.owners + added.brands + added.floatTypes + added.fishTypes + added.venues;

        if (!totalAdded) {
          showInfoModal('Nothing to add — every value already in use is already in the lists below.', 'All caught up');
          return;
        }

        showInfoModal(
          'Added ' + added.owners + ' owner(s), ' + added.brands + ' brand(s), ' +
          added.floatTypes + ' float type(s), ' + added.fishTypes + ' fish type(s), ' +
          'and ' + added.venues + ' venue(s).',
          'Populated from existing data'
        );
        loadEverything();
      })
      .withFailureHandler(function (err) {
        clearButtonBusy(btn);
        showInfoModal(err.message || String(err), 'Could not populate from existing data');
      })
      .seedValidationsFromExistingData();
  }

  /**
   * Renders the Validations tab: one group per field, each with an add
   * form and the current list of values.
   * @return {void}
   */
  function renderValidationsTab() {
    var container = document.getElementById('validationsGrid');
    if (!container || !validations) return;

    container.innerHTML = VALIDATION_FIELDS
      .map(function (field) { return buildValidationGroupHtml(field); })
      .join('');

    renderValidationSeedBar();
  }

  /**
   * Shows or hides the "Populate from existing data" button: only shown
   * when there's actually something it would add, with a summary of what.
   * @return {void}
   */
  function renderValidationSeedBar() {
    var bar = document.getElementById('validationSeedBar');
    if (!bar) return;

    google.script.run
      .withSuccessHandler(function (missing) {
        var totalMissing = VALIDATION_FIELDS.reduce(function (sum, field) {
          return sum + missing[field.key].length;
        }, 0);

        if (!totalMissing) {
          bar.hidden = true;
          return;
        }

        var summary = VALIDATION_FIELDS
          .map(function (field) {
            var values = missing[field.key];
            if (!values.length) return null;
            return field.label + ': ' + values.join(', ');
          })
          .filter(Boolean)
          .join(' · ');

        document.getElementById('validationSeedHint').textContent =
          'Found ' + totalMissing + ' value' + (totalMissing === 1 ? '' : 's') +
          ' in use but missing from the lists above — ' + summary + '.';
        bar.hidden = false;
      })
      .withFailureHandler(function () {
        bar.hidden = true; // fail quiet — the button just doesn't offer itself
      })
      .previewValidationSeed();
  }

  /**
   * Builds the HTML for one Validations group (e.g. all of "Owners"): its
   * heading, add form, and current list of values.
   * @param {{key: string, label: string}} field - One entry from VALIDATION_FIELDS.
   * @return {string} HTML markup.
   */
  function buildValidationGroupHtml(field) {
    var values = validations[field.key] || [];

    var rowsHtml = values
      .map(function (value) { return buildValidationListItemHtml(field.key, value); })
      .join('');

    var listHtml = rowsHtml
      ? '<div class="validation-list">' + rowsHtml + '</div>'
      : '<div class="empty-state">None yet.</div>';

    return (
      '<div class="validation-group">' +
      '<h4>' + escapeHtml(field.label) + '</h4>' +
      '<form class="validation-add-form" data-field="' + field.key + '">' +
      '<input type="text" placeholder="Add ' + escapeHtml(field.label.toLowerCase()) + '…" required>' +
      '<button type="submit" class="primary-btn" title="Add this value to the list">Add</button>' +
      '</form>' +
      listHtml +
      '</div>'
    );
  }

  /**
   * Builds the HTML for one Validations list row, in its normal
   * (non-editing) display state.
   * @param {string} fieldKey - One of VALIDATION_FIELDS' keys.
   * @param {string} value - The value this row represents.
   * @return {string} HTML markup.
   */
  function buildValidationListItemHtml(fieldKey, value) {
    return (
      '<div class="validation-list-item" data-field="' + fieldKey + '" data-value="' + escapeHtml(value) + '">' +
      '<span class="validation-list-value">' + escapeHtml(value) + '</span>' +
      '<span class="validation-list-actions">' +
      '<button type="button" class="icon-btn" data-action="edit-validation" title="Rename">✏️</button>' +
      '<button type="button" class="icon-btn" data-action="delete-validation" title="Delete">🗑️</button>' +
      '</span>' +
      '</div>'
    );
  }

  /**
   * Submit handler for a Validations "Add" form: sends the new value to
   * the server, then does a full reload so every tab picks up the change.
   * @param {SubmitEvent} e - Form submit event.
   * @return {void}
   */
  function handleValidationAddSubmit(e) {
    var form = e.target.closest('.validation-add-form');
    if (!form) return;
    e.preventDefault();

    var fieldKey = form.dataset.field;
    var input = form.querySelector('input');
    var value = input.value.trim();
    if (!value) return;

    var submitBtn = form.querySelector('button[type="submit"]');
    setButtonBusy(submitBtn);

    google.script.run
      .withSuccessHandler(loadEverything)
      .withFailureHandler(function (err) {
        clearButtonBusy(submitBtn);
        showInfoModal(err.message || String(err), 'Could not add value');
      })
      .addValidationEntry(fieldKey, value);
  }

  /**
   * Delegated click handler for the Validations tab: routes clicks on the
   * rename/save/cancel/delete controls of any list row to their actions.
   * @param {MouseEvent} e - Click event within #validationsGrid.
   * @return {void}
   */
  function handleValidationListClick(e) {
    var editBtn = e.target.closest('[data-action="edit-validation"]');
    if (editBtn) {
      startEditingValidationItem(editBtn.closest('.validation-list-item'));
      return;
    }

    var saveBtn = e.target.closest('[data-action="save-validation-edit"]');
    if (saveBtn) {
      saveValidationItemEdit(saveBtn.closest('.validation-list-item'));
      return;
    }

    var cancelBtn = e.target.closest('[data-action="cancel-validation-edit"]');
    if (cancelBtn) {
      renderValidationsTab(); // simplest way to discard the in-progress edit
      return;
    }

    var deleteBtn = e.target.closest('[data-action="delete-validation"]');
    if (deleteBtn) {
      confirmDeleteValidationItem(deleteBtn.closest('.validation-list-item'));
    }
  }

  /**
   * Swaps a Validations list row into edit mode: its value becomes a text
   * input with Save/Cancel buttons in place of the usual label and
   * Rename/Delete buttons.
   * @param {HTMLElement} item - The .validation-list-item element.
   * @return {void}
   */
  function startEditingValidationItem(item) {
    var value = item.dataset.value;

    item.innerHTML =
      '<input type="text" value="' + escapeHtml(value) + '">' +
      '<span class="validation-list-actions">' +
      '<button type="button" class="icon-btn" data-action="save-validation-edit" title="Save">💾</button>' +
      '<button type="button" class="icon-btn" data-action="cancel-validation-edit" title="Cancel">✖️</button>' +
      '</span>';

    var input = item.querySelector('input');
    input.focus();
    input.select();
  }

  /**
   * Saves an in-progress rename: sends the old/new value to the server,
   * then does a full reload so every tab picks up the change.
   * @param {HTMLElement} item - The .validation-list-item element, in edit mode.
   * @return {void}
   */
  function saveValidationItemEdit(item) {
    var fieldKey = item.dataset.field;
    var oldValue = item.dataset.value;
    var newValue = item.querySelector('input').value.trim();

    if (!newValue || newValue === oldValue) {
      renderValidationsTab();
      return;
    }

    item.querySelector('input').disabled = true;
    item.querySelector('[data-action="cancel-validation-edit"]').disabled = true;
    setButtonBusy(item.querySelector('[data-action="save-validation-edit"]'));

    google.script.run
      .withSuccessHandler(loadEverything)
      .withFailureHandler(function (err) {
        showInfoModal(err.message || String(err), 'Could not rename value');
        renderValidationsTab();
      })
      .updateValidationEntry(fieldKey, oldValue, newValue);
  }

  /**
   * Asks for confirmation before deleting a Validations value, then sends
   * the delete to the server and does a full reload.
   * @param {HTMLElement} item - The .validation-list-item element to delete.
   * @return {void}
   */
  function confirmDeleteValidationItem(item) {
    var fieldKey = item.dataset.field;
    var value = item.dataset.value;

    showConfirmModal(
      'Delete "' + value + '"? Any existing gear or catches that reference it will be hidden ' +
      'until you add the value back — nothing on the spreadsheet itself is deleted.',
      function () {
        item.querySelector('[data-action="edit-validation"]').disabled = true;
        setButtonBusy(item.querySelector('[data-action="delete-validation"]'));

        google.script.run
          .withSuccessHandler(loadEverything)
          .withFailureHandler(function (err) {
            showInfoModal(err.message || String(err), 'Could not delete value');
            renderValidationsTab();
          })
          .deleteValidationEntry(fieldKey, value);
      }
    );
  }

  /**
   * Wires up the Add Gear form: toggling the Type field for Floats, and
   * handling submit (validation, saving via addEntry, and feedback).
   * @return {void}
   */
  function setupAddForm() {
    var categorySelect = document.getElementById('addCategory');
    var typeField = document.getElementById('typeField');

    function toggleTypeField() {
      typeField.hidden = categorySelect.value !== 'Floats';
    }
    categorySelect.addEventListener('change', toggleTypeField);
    toggleTypeField();

    document.getElementById('addForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var status = document.getElementById('addStatus');
      var submitBtn = document.getElementById('addSubmitBtn');

      var entry = {
        category: categorySelect.value,
        brand: document.getElementById('addBrand').value.trim(),
        name: document.getElementById('addName').value.trim(),
        type: document.getElementById('addType').value.trim(),
        owner: document.getElementById('addOwner').value.trim()
      };

      if (!entry.name || !entry.owner) {
        status.className = 'status-msg error';
        status.textContent = 'Name and Owner are required.';
        showInfoModal('You must fill in a Name and an Owner before you can save.', 'Just a moment');
        return;
      }

      setButtonBusy(submitBtn);
      status.className = 'status-msg';
      status.textContent = 'Saving\u2026';

      google.script.run
        .withSuccessHandler(function () {
          status.className = 'status-msg success';
          status.textContent = 'Added \u2713';
          document.getElementById('addForm').reset();
          toggleTypeField();
          clearButtonBusy(submitBtn);
          loadEverything(); // refresh browse/compare with the new entry
        })
        .withFailureHandler(function (err) {
          var message = err.message || 'Something went wrong.';
          status.className = 'status-msg error';
          status.textContent = message;
          clearButtonBusy(submitBtn);
          showInfoModal(message, 'Could not save');
        })
        .addEntry(entry);
    });
  }

  // ---------- utils ----------

  /**
   * Puts a button into a busy state for the duration of an async action:
   * disables it and swaps its content for a small spinner, remembering
   * the original content so clearButtonBusy() can restore it.
   * @param {HTMLButtonElement} button - Button to mark busy.
   * @return {void}
   */
  function setButtonBusy(button) {
    if (!button || button.dataset.busy === 'true') return;
    button.dataset.busy = 'true';
    button.dataset.originalHtml = button.innerHTML;
    button.disabled = true;
    button.innerHTML = '<span class="btn-spinner"></span>';
  }

  /**
   * Restores a button put into a busy state by setButtonBusy(): re-enables
   * it and puts its original content back.
   * @param {HTMLButtonElement} button - Button to restore.
   * @return {void}
   */
  function clearButtonBusy(button) {
    if (!button || button.dataset.busy !== 'true') return;
    button.innerHTML = button.dataset.originalHtml;
    delete button.dataset.originalHtml;
    delete button.dataset.busy;
    button.disabled = false;
  }

  /**
   * Escapes &, <, >, and " so a value can be safely inserted into HTML.
   * @param {*} str - Value to escape.
   * @return {string} Escaped string ('' for null/undefined).
   */
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
