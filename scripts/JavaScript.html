<script>
  var CATEGORIES = ['Dips', 'Sprays', 'Corn', 'Floats', 'Dough'];
  var BRANDS = [];
  var allData = null;      // category -> array of items
  var validations = null;  // {brands, owners, floatTypes}
  var fishIndex = null;    // category -> { itemNameLower: [catchEntry, ...] }
  var fishCatches = [];
  var currentCatchItem = null;
  var currentEditingCatchRowIndex = null; // set while the Record Catch modal is editing an existing catch, instead of adding a new one
  var currentEditingCatchPhotoFileId = ''; // that catch's existing photo, if any — carried through so an untouched photo isn't lost on save
  var photoFolderConfigured = false; // whether Settings has a photo-storage folder set — controls whether the photo field even appears
  var catchPhotoMarkedForRemoval = false; // set by the "Remove Photo" button; cleared as soon as a photo is shown again (new selection, or an existing one being previewed)
  document.addEventListener('DOMContentLoaded', function () {
    setupTabs();
    setupBrowseFilters();
    setupStatsFilters();
    setupFishFilters();
    setupLookupTab();
    setupAddForm();
    setupFishModal();
    setupRecordCatchModal();
    setupInfoModal();
    setupConfirmModal();
    setupValidationsTab();
    setupPhotoFolderSettings();
    renderPhotoFolderStatus();
    loadEverything();
  });

  /**
   * Wires up the top-level tab buttons so clicking one shows its panel
   * and hides the others.
   * @return {void}
   */
  function setupTabs() {
    var buttons = document.querySelectorAll('.tab-btn');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-panel').forEach(function (p) {
          p.classList.remove('active');
        });
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });
  }

  // Category list is static, so it's built once here. The owner list is
  // dynamic (new owners can appear via Add Gear), so it's rebuilt on
  // every refresh by populateOwnerFilter() — but change listeners are
  // attached only here, once, so they never stack up on refresh.
  /**
   * Builds the Browse tab's category dropdown and attaches change/input
   * listeners to all filter controls, once. Called only on page load —
   * owner/brand option lists are refreshed separately without re-attaching
   * listeners.
   * @return {void}
   */
  function setupBrowseFilters() {
    var catSelect = document.getElementById('browseCategory');
    document.getElementById('browseFishCaught').addEventListener('change', renderBrowse);
    CATEGORIES.forEach(function (cat) {
      var opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      catSelect.appendChild(opt);
    });
    catSelect.addEventListener('change', renderBrowse);
    document.getElementById('browseSearch').addEventListener('input', renderBrowse);
    document.getElementById('browseBrand').addEventListener('change', renderBrowse);
    document.getElementById('browseOwner').addEventListener('change', renderBrowse);
  }

  /**
   * Replaces a container's content with a spinner and message.
   * @param {string} containerId - Element id of the container to fill.
   * @param {string} message - Loading message to display.
   * @return {void}
   */
  function showLoading(containerId, message) {
    var el = document.getElementById(containerId);
    el.innerHTML = '<div class="loading-state"><div class="spinner"></div><span>' +
      escapeHtml(message) + '</span></div>';
  }

  /**
   * Kicks off all server round-trips needed to populate the app
   * (inventory data, validations, fish catches) and re-renders every tab
   * once its data arrives. allData/fishCatches/fishIndex are re-filtered
   * (see applyValidationFilters) and every affected tab is re-rendered
   * from each handler, since allData, validations, and fishCatches load
   * independently and any of them can be the one to arrive last.
   * @return {void}
   */
  function loadEverything() {
    showLoading('browseResults', 'Loading your gear\u2026');
    showLoading('compareTable', 'Crunching the numbers\u2026');
    showLoading('restockResults', 'Checking stock levels\u2026');

    google.script.run
      .withSuccessHandler(function (data) {
        allData = data;
        applyValidationFilters();
        renderBrowse();
        renderRestock();
        renderStats();
        populateLookupSelects();
      })
      .withFailureHandler(showLoadError)
      .getAllData();

    google.script.run
      .withSuccessHandler(function (v) {
        validations = v;
        applyValidationFilters();
        populateOwnerFilter();
        populateOwnerSelect('statsOwnerFilter');
        populateBrandFilter();
        populateFishTypeFilter();
        populateFishVenueFilter();
        populateFormDatalists();
        populateLookupSelects();
        renderValidationsTab();
        renderBrowse();
        renderRestock();
        renderCompare();
        renderStats();
      })
      .withFailureHandler(showLoadError)
      .getValidations();

    google.script.run
      .withSuccessHandler(function (data) {
        fishCatches = data;
        applyValidationFilters();
        renderBrowse();
        renderFishTab();
        renderStats();
      })
      .withFailureHandler(function () {
        fishCatches = [];
        applyValidationFilters();
        renderFishTab();
        renderStats();
      })
      .getFishCatches();
  }

  /**
   * True if `value` is blank, or matches (case-insensitively) an entry in
   * `knownValues`. Blank is always allowed since brand/float-type are
   * optional fields on gear items.
   * @param {Array<string>} knownValues - A Validations list (e.g. validations.owners).
   * @param {string} value - The field value to check.
   * @return {boolean}
   */
  function isKnownOrBlank(knownValues, value) {
    var trimmed = (value || '').toString().trim();
    if (!trimmed) return true;

    var lower = trimmed.toLowerCase();
    return (knownValues || []).some(function (known) {
      return known.toLowerCase() === lower;
    });
  }

  /**
   * Filters one category's item rows down to those whose owner/brand
   * (and, for Floats, type) are all still present in the current
   * Validations lists. This is what makes deleting a Validations value a
   * soft delete: the underlying sheet rows are never touched, so adding
   * the value back makes the hidden items reappear.
   * @param {Array<Object>} items - Item rows from allData[category].
   * @param {string} category - One of CATEGORIES.
   * @return {Array<Object>} The visible subset of items.
   */
  function filterVisibleItems(items, category) {
    if (!validations) return items;
    return items.filter(function (it) {
      if (!isKnownOrBlank(validations.owners, it.owner)) return false;
      if (!isKnownOrBlank(validations.brands, it.brand)) return false;
      if (category === 'Floats' && !isKnownOrBlank(validations.floatTypes, it.type)) return false;
      return true;
    });
  }

  /**
   * Filters fish catches down to those whose owner, fish type, and venue
   * are all still present in the current Validations lists. Same
   * soft-delete behavior as filterVisibleItems().
   * @param {Array<Object>} catches - Catch rows from fishCatches.
   * @return {Array<Object>} The visible subset of catches.
   */
  function filterVisibleCatches(catches) {
    if (!validations) return catches;
    return catches.filter(function (c) {
      if (!isKnownOrBlank(validations.owners, c.owner)) return false;
      if (!isKnownOrBlank(validations.fishTypes, c.fishType)) return false;
      if (!isKnownOrBlank(validations.venues, c.where)) return false;
      return true;
    });
  }

  /**
   * Builds a fish-catch index (category -> item name, lowercased -> list
   * of catch entries that used that item), the same shape the server's
   * old getFishCatchIndex() returned. Built client-side, from whatever
   * catch list is passed in, so it can be rebuilt after Validations
   * filtering without another server round trip.
   * @param {Array<Object>} catches - Catch rows (already filtered to what should be visible).
   * @return {Object} category -> itemNameLower -> Array<catchEntry>.
   */
  function buildFishCatchIndex(catches) {
    var index = {};
    CATEGORIES.forEach(function (cat) { index[cat] = {}; });

    catches.forEach(function (rawCatch) {
      var combo = {};
      CATEGORIES.forEach(function (cat) { combo[cat] = rawCatch[cat.toLowerCase()] || []; });

      var catchEntry = {
        fishType: rawCatch.fishType,
        weight: rawCatch.weight,
        where: rawCatch.where,
        date: rawCatch.date,
        owner: rawCatch.owner,
        photoUrl: rawCatch.photoUrl,
        combo: combo
      };

      CATEGORIES.forEach(function (cat) {
        combo[cat].forEach(function (itemName) {
          var key = String(itemName || '').trim().toLowerCase();
          if (!key) return;
          if (!index[cat][key]) index[cat][key] = [];
          index[cat][key].push(catchEntry);
        });
      });
    });

    return index;
  }

  /**
   * Re-applies the Validations-based visibility filter to allData and
   * fishCatches, in place, and rebuilds fishIndex from the filtered
   * catches. Safe to call any time after allData, validations, or
   * fishCatches changes \u2014 filtering an already-filtered list again is a
   * no-op, since the sheet (re-fetched fresh on every loadEverything()
   * call) is the only place data actually gets removed.
   * @return {void}
   */
  function applyValidationFilters() {
    if (allData) {
      CATEGORIES.forEach(function (cat) {
        allData[cat] = filterVisibleItems(allData[cat] || [], cat);
      });
    }

    fishCatches = filterVisibleCatches(Array.isArray(fishCatches) ? fishCatches : []);
    fishIndex = buildFishCatchIndex(fishCatches);
  }

  /**
   * Displays a load-failure message in the Browse, Compare, and Restock
   * containers.
   * @param {Error|Object} err - Error from a failed google.script.run call.
   * @return {void}
   */
  function showLoadError(err) {
    var msg = '<div class="empty-state">Could not load data: ' + escapeHtml(err.message || err) + '</div>';
    document.getElementById('browseResults').innerHTML = msg;
    document.getElementById('compareTable').innerHTML = msg;
    document.getElementById('restockResults').innerHTML = msg;
  }

  // ---------- BROWSE TAB ----------
  /**
   * Rebuilds the Browse tab's brand filter options from the latest
   * validations, preserving the current selection if still valid.
   * @return {void}
   */
  function populateBrandFilter(){
    var brandSelect = document.getElementById('browseBrand');
    var previousValue = brandSelect.value;

    // Clear everything except the "All brands" placeholder (first option),
    // then rebuild from the latest brand list. This is what prevents
    // duplicates when loadEverything() runs again after adding an entry.
    while (brandSelect.options.length > 1) {
      brandSelect.remove(1);
    }

    validations.brands.forEach(function (brand) {
      var opt = document.createElement('option');
      opt.value = brand;
      opt.textContent = brand;
      brandSelect.appendChild(opt);
    });

    // Keep whatever the user had selected, if it's still a valid option.
    var stillValid = Array.prototype.some.call(brandSelect.options, function (o) {
      return o.value === previousValue;
    });
    brandSelect.value = stillValid ? previousValue : '__all__';
  }
  /**
   * Rebuilds the Browse tab's owner filter options from the latest
   * validations, preserving the current selection if still valid.
   * @return {void}
   */
  function populateOwnerFilter() {
    populateOwnerSelect('browseOwner');
  }

  /**
   * Rebuilds an owner filter <select>'s options from the latest
   * validations, preserving the current selection if still valid. Shared
   * by every owner filter in the app (Browse, Stats).
   * @param {string} selectId - Element id of the <select>.
   * @return {void}
   */
  function populateOwnerSelect(selectId) {
    var select = document.getElementById(selectId);
    if (!select) return;
    var previousValue = select.value;

    // Clear everything except the "All owners" placeholder (first option),
    // then rebuild from the latest owner list. This is what prevents
    // duplicates when loadEverything() runs again after adding an entry.
    while (select.options.length > 1) {
      select.remove(1);
    }

    validations.owners.forEach(function (owner) {
      var opt = document.createElement('option');
      opt.value = owner;
      opt.textContent = owner;
      select.appendChild(opt);
    });

    // Keep whatever the user had selected, if it's still a valid option.
    var stillValid = Array.prototype.some.call(select.options, function (o) {
      return o.value === previousValue;
    });
    select.value = stillValid ? previousValue : '__all__';
  }

  // ---------- STATS TAB FILTER ----------

  /**
   * Wires up the Stats tab's owner filter, once, on page load.
   * @return {void}
   */
  function setupStatsFilters() {
    document.getElementById('statsOwnerFilter').addEventListener('change', function () {
      renderStats();
      renderCompare();
    });
  }

  /**
   * Reads the Stats tab's currently selected owner filter.
   * @return {string} An owner name, or '__all__'.
   */
  function getStatsOwnerFilter() {
    var select = document.getElementById('statsOwnerFilter');
    return select ? select.value : '__all__';
  }

  // ---------- FISH TAB FILTERS ----------

  /**
   * Wires up the Fishes Caught tab's fish type/venue/search filter
   * controls, once, on page load.
   * @return {void}
   */
  function setupFishFilters() {
    document.getElementById('fishFilterType').addEventListener('change', renderFishTab);
    document.getElementById('fishFilterVenue').addEventListener('change', renderFishTab);
    document.getElementById('fishFilterSearch').addEventListener('input', renderFishTab);
    document.getElementById('recordFishBtn').addEventListener('click', function () {
      openRecordCatchModal();
    });
    document.getElementById('fishCatchList').addEventListener('click', handleFishCatchListClick);
  }

  /**
   * Rebuilds the Fishes Caught tab's fish type filter options from the
   * latest validations, preserving the current selection if still valid.
   * @return {void}
   */
  function populateFishTypeFilter() {
    var select = document.getElementById('fishFilterType');
    var previousValue = select.value;

    while (select.options.length > 1) {
      select.remove(1);
    }

    (validations.fishTypes || []).forEach(function (type) {
      var opt = document.createElement('option');
      opt.value = type;
      opt.textContent = type;
      select.appendChild(opt);
    });

    var stillValid = Array.prototype.some.call(select.options, function (o) {
      return o.value === previousValue;
    });
    select.value = stillValid ? previousValue : '__all__';
  }

  /**
   * Rebuilds the Fishes Caught tab's venue filter options from the latest
   * validations, preserving the current selection if still valid.
   * @return {void}
   */
  function populateFishVenueFilter() {
    var select = document.getElementById('fishFilterVenue');
    var previousValue = select.value;

    while (select.options.length > 1) {
      select.remove(1);
    }

    (validations.venues || []).forEach(function (venue) {
      var opt = document.createElement('option');
      opt.value = venue;
      opt.textContent = venue;
      select.appendChild(opt);
    });

    var stillValid = Array.prototype.some.call(select.options, function (o) {
      return o.value === previousValue;
    });
    select.value = stillValid ? previousValue : '__all__';
  }

  /**
   * Filters, sorts, and renders the Browse tab's item cards based on the
   * current category/owner/brand/search/fish-caught filter selections.
   * @return {void}
   */
  function renderBrowse() {
  if (!allData) return;

  var ownerFilter = document.getElementById('browseOwner').value;
  var categoryFilter = document.getElementById('browseCategory').value;
  var fishCaughtFilter = document.getElementById('browseFishCaught').value;
  var brandFilter = document.getElementById('browseBrand').value;
  var search = document.getElementById('browseSearch').value;

  var container = document.getElementById('browseResults');
  container.innerHTML = '';

  var categoriesToShow = categoryFilter === '__all__' ? CATEGORIES : [categoryFilter];
  var anyResults = false;

  categoriesToShow.forEach(function (cat) {

    var items = allData[cat] || [];

    if (ownerFilter !== '__all__') {
      items = items.filter(function (it) {
        return it.owner === ownerFilter;
      });
    }
    if(brandFilter !== '__all__') {
      items = items.filter(function (it) {
        return it.brand === brandFilter;
      });
    }
    var catIndex = (fishIndex && fishIndex[cat]) || {};

    if (fishCaughtFilter === "caught") {
      items = items.filter(function (it) {
        return (catIndex[it.name.trim().toLowerCase()] || []).length > 0;
      });
    }

    if (fishCaughtFilter === "notcaught") {
      items = items.filter(function (it) {
        return (catIndex[it.name.trim().toLowerCase()] || []).length === 0;
      });
    }
    if (search && search.length > 0) {
      items = items.filter(function (it) {
        return it.name.toLowerCase().includes(search.toLowerCase());
      });
    }
    if (items.length === 0) return;
    // Sort by brand, then name
    items.sort(function (a, b) {
      var brandCompare = (a.brand || '').localeCompare(b.brand || '');

      if (brandCompare !== 0) {
        return brandCompare;
      }

      return (a.name || '').localeCompare(b.name || '');
    });
    anyResults = true;
    container.appendChild(buildCategoryCard(cat, items));
  });

  if (!anyResults) {
    container.innerHTML = '<div class="empty-state">No entries match that filter.</div>';
  }
}
  // Categories collapsed by the user persist across filter/refresh
  // redraws for the session, via this set of category names. Starts with
  // every category in it so cards are collapsed by default; expanding one
  // removes it from the set.
  var collapsedCategories = new Set(CATEGORIES);

  /**
   * Builds a collapsible card containing a table of items for one category,
   * used by both the Browse and Restock tabs.
   * @param {string} category - One of CATEGORIES.
   * @param {Array<Object>} items - Item rows to render for this category.
   * @return {HTMLElement} The category card element.
   */
  function buildCategoryCard(category, items) {
    var card = document.createElement('div');
    card.className = 'category-card';

    var isCollapsed = collapsedCategories.has(category);

    var header = document.createElement('button');
    header.type = 'button';
    header.className = 'category-card-header';
    header.setAttribute('aria-expanded', String(!isCollapsed));
    header.title = isCollapsed ? 'Expand ' + category : 'Collapse ' + category;
    header.innerHTML =
      '<span class="category-card-title">' +
      '<span class="chevron' + (isCollapsed ? ' collapsed' : '') + '">&#9660;</span>' +
      '<h3>' + escapeHtml(category) + '</h3>' +
      '</span>' +
      '<span class="badge">' + items.length + ' item' + (items.length === 1 ? '' : 's') + '</span>';
    header.addEventListener('click', function () {
      if (collapsedCategories.has(category)) {
        collapsedCategories.delete(category);
      } else {
        collapsedCategories.add(category);
      }
      renderBrowse();
    });
    card.appendChild(header);

    var showType = category === 'Floats';
    var tableWrap = document.createElement('div');
    tableWrap.className = 'item-table-wrap' + (isCollapsed ? ' collapsed' : '');
    var table = document.createElement('table');
    table.className = 'item-table';

    var headCols =
      '<th>Brand</th>' +
      '<th>Name</th>' +
      (showType ? '<th>Type</th>' : '') +
      '<th>Owner</th>' +
      '<th class="col-actions">Fish</th>' +
      '<th class="col-actions">Record</th>' +
      '<th class="col-actions">Status</th>' +
      '<th class="col-actions">Delete</th>';

    var catIndex = (fishIndex && fishIndex[category]) || {};

    var bodyRows = items.map(function (it) {

    var catches = catIndex[it.name.trim().toLowerCase()] || [];

      var fishBtn =
        catches.length
          ? '<button type="button" class="icon-btn" data-action="show-catches"' +
          ' data-category="' + category + '"' +
          ' data-name="' + escapeHtml(it.name) + '"' +
          ' title="See the ' + catches.length + ' catch' + (catches.length === 1 ? '' : 'es') + ' that used this">' +
          '🎣 <span class="badge">' + catches.length + '</span></button>'
          : '&mdash;';

      var recordBtn =
        '<button class="icon-btn"' +
        ' data-action="record-catch"' +
        ' data-category="' + category + '"' +
        ' data-name="' + escapeHtml(it.name) + '"' +
        ' title="Record a catch using this item"' +
        '>📝</button>';

      var brandCell =
        it.brand
          ? escapeHtml(it.brand)
          : '<input class="inline-edit"' +
          ' data-action="edit-brand"' +
          ' data-category="' + category + '"' +
          ' data-row="' + it.rowIndex + '"' +
          ' placeholder="Brand">';

      var typeCell = '';

      if (showType) {

        typeCell =
          it.type
            ? escapeHtml(it.type)
            : '<input class="inline-edit"' +
            ' data-action="edit-type"' +
            ' data-category="' + category + '"' +
            ' data-row="' + it.rowIndex + '"' +
            ' placeholder="Type">';

      }

      var statusBtn =
        '<button type="button"' +
        ' class="status-btn' + (it.usedUp ? ' is-used-up' : '') + '"' +
        ' data-action="toggle-status"' +
        ' data-category="' + category + '"' +
        ' data-row="' + it.rowIndex + '"' +
        ' data-used-up="' + it.usedUp + '"' +
        ' title="' + (it.usedUp ? 'Mark as Available' : 'Mark as Used Up') + '">' +
        (it.usedUp ? 'Used Up' : 'Available') +
        '</button>';

      var deleteBtn =
        '<button type="button" class="icon-btn"' +
        ' data-action="delete-item"' +
        ' data-category="' + category + '"' +
        ' data-row="' + it.rowIndex + '"' +
        ' data-name="' + escapeHtml(it.name) + '"' +
        ' title="Delete this item permanently">🗑️</button>';

      return '<tr>' +
        '<td class="item-name" data-label="Brand">' + brandCell + '</td>' +
        '<td class="item-name" data-label="Name" title="' + escapeHtml(it.name) + '">' + escapeHtml(it.name) + '</td>' +
        (showType ? '<td data-label="Type">' + typeCell + '</td>' : '') +
        '<td data-label="Owner" title="' + escapeHtml(it.owner) + '">' + escapeHtml(it.owner) + '</td>' +
        '<td data-label="Fish">' + fishBtn + '</td>' +
        '<td data-label="Record" title="Record a catch">' + recordBtn + '</td>' +
        '<td data-label="Status">' + statusBtn + '</td>' +
        '<td data-label="Delete">' + deleteBtn + '</td>' +
        '</tr>';

    }).join('');

    table.innerHTML = '<thead><tr>' + headCols + '</tr></thead><tbody>' + bodyRows + '</tbody>';
    table.addEventListener('click', handleItemTableClick);
    tableWrap.appendChild(table);
    card.appendChild(tableWrap);

    return card;
  }

  // Handles both the "show catches" and "toggle status" buttons for any
  // item row, in Browse or Restock, via delegation on the table.
  /**
   * Delegated click handler for an item table: routes clicks on the
   * "show catches", "record catch", inline-edit input, and "toggle status"
   * controls to their respective actions.
   * @param {MouseEvent} e - Click event on the table.
   * @return {void}
   */
  function handleItemTableClick(e) {
    var fishBtn = e.target.closest('[data-action="show-catches"]');
    if (fishBtn) {
      openFishModal(fishBtn.dataset.category, fishBtn.dataset.name);
      return;
    }
    var recordBtn = e.target.closest('[data-action="record-catch"]');

    if (recordBtn) {

      openRecordCatchModal(
        recordBtn.dataset.category,
        recordBtn.dataset.name
      );

      return;

    }
    var edit = e.target.closest('.inline-edit');

    if (edit) {

      edit.addEventListener('change', function () {

        edit.disabled = true;
        var spinner = document.createElement('span');
        spinner.className = 'btn-spinner';
        spinner.style.marginLeft = '6px';
        edit.insertAdjacentElement('afterend', spinner);

        google.script.run
          .withSuccessHandler(loadEverything)
          .withFailureHandler(function (err) {
            edit.disabled = false;
            spinner.remove();
            showInfoModal(err.message || String(err), 'Could not save');
          })
          .updateItemField(
            edit.dataset.category,
            Number(edit.dataset.row),
            edit.dataset.action === 'edit-brand'
              ? 'brand'
              : 'type',
            edit.value
          );

      }, { once: true });

    }
    var statusBtn = e.target.closest('[data-action="toggle-status"]');
    if (statusBtn) {
      var category = statusBtn.dataset.category;
      var rowIndex = Number(statusBtn.dataset.row);
      var newUsedUp = statusBtn.dataset.usedUp !== 'true'; // flip current state
      toggleItemStatus(category, rowIndex, newUsedUp, statusBtn);
      return;
    }
    var deleteBtn = e.target.closest('[data-action="delete-item"]');
    if (deleteBtn) {
      confirmDeleteItem(deleteBtn.dataset.category, Number(deleteBtn.dataset.row), deleteBtn.dataset.name, deleteBtn);
    }
  }

  /**
   * Asks for confirmation before permanently deleting a gear item, then
   * sends the delete to the server and does a full reload. Unlike
   * deleting a Validations value, this is a real, permanent delete of the
   * sheet row — there's no "add it back and it reappears" undo.
   * @param {string} category - One of CATEGORIES.
   * @param {number} rowIndex - The sheet row number (as returned by getAllData).
   * @param {string} name - Item name, for the confirmation message.

/**

 * @return {void}
 */
function openEditCatchModal(rowIndex){

    var existingCatch = (Array.isArray(fishCatches) ? fishCatches : [])
        .find(function (fishCatch) { return fishCatch.rowIndex === rowIndex; });

    if (!existingCatch) {
        showInfoModal('That catch could not be found — try refreshing.', 'Not found');
        return;
    }

    currentEditingCatchRowIndex = rowIndex;
    currentCatchItem = null;

    document.getElementById("recordCatchModalTitle").textContent = "Edit Catch";
    document.getElementById("recordCatchSubmitBtn").textContent = "Save Changes";

    document.getElementById("recordCatchForm").reset();

    document.getElementById("catchDate").value = existingCatch.date || new Date().toISOString().substring(0,10);
    document.getElementById("catchFishType").value = existingCatch.fishType || '';
    document.getElementById("catchWeight").value = existingCatch.weight || '';
    document.getElementById("catchOwner").value = existingCatch.owner || '';

    buildVenueDropdown();

    var venueSelect = document.getElementById("catchVenue");
    var hasMatchingVenue = Array.prototype.some.call(venueSelect.options, function (venueOption) {
        return venueOption.value === existingCatch.where;
    });

    if (hasMatchingVenue) {
        venueSelect.value = existingCatch.where;
        document.getElementById("otherVenueField").hidden = true;
    } else {
        venueSelect.value = "__other__";
        document.getElementById("otherVenueField").hidden = false;
        document.getElementById("otherVenue").value = existingCatch.where || '';
    }

    buildBaitSelections(preselectedBaitFromCatch_(existingCatch));

    currentEditingCatchPhotoFileId = existingCatch.photoFileId || '';
    if (currentEditingCatchPhotoFileId) {
        showCatchPhotoPreview(existingCatch.photoUrl);
    } else {
        resetCatchPhotoPreview();
    }
    updateCatchPhotoFieldVisibility();

    document
        .getElementById("recordCatchModal")
        .hidden=false;

/**
 * Populates the Record Catch modal's bait checkboxes, grouped by category,
 * pre-checking the item that triggered the modal.
 * @param {string} category - Category of the item that triggered this.
 * @param {string} item - Name of the item that triggered this.
 * @return {void}
 */
/**
 * Builds a { category -> [lowercased name, ...] } preselection map for a
 * single triggering item (the "record catch" 📝 button on one item row).
 * @param {string} category - Category of the triggering item.
 * @param {string} itemName - Name of the triggering item.
 * @return {Object} Preselection map for buildBaitSelections().
 */
function preselectedBaitFromItem_(category, itemName) {
    var preselected = {};
    CATEGORIES.forEach(function (cat) { preselected[cat] = []; });

    var key = (itemName || '').trim().toLowerCase();
    if (category && key) preselected[category] = [key];

    return preselected;
}

/**
 * Builds a { category -> [lowercased name, ...] } preselection map from
 * an existing catch's recorded bait/gear combo, for editing.
 * @param {Object} c - A catch entry (from fishCatches).
 * @return {Object} Preselection map for buildBaitSelections().
 */
function preselectedBaitFromCatch_(c) {
    var preselected = {};
    CATEGORIES.forEach(function (cat) {
        preselected[cat] = (c[cat.toLowerCase()] || []).map(function (name) {
            return String(name || '').trim().toLowerCase();
        });
    });
    return preselected;
}

/**
 * Populates the Record Catch modal's bait checkboxes, grouped by
 * category, pre-checking whichever items are named in `preselected`.
 * @param {Object} preselected - { category -> [lowercased name, ...] }, from preselectedBaitFromItem_/preselectedBaitFromCatch_.
 * @return {void}
 */
function buildBaitSelections(preselected){

    var container=document.getElementById("catchBaitSelections");

    container.innerHTML="";

    CATEGORIES.forEach(function(cat){

        var div=document.createElement("div");

        div.className="bait-group";

        div.innerHTML="<h4>"+cat+"</h4>";

        var preselectedNames = preselected[cat] || [];

        // Same-named items owned by different people are the same "bait"
        // from a catch-logging perspective, so only one checkbox per
        // distinct name is rendered per category — otherwise a shared dip
        // (e.g. two owners both have "Honey +") would render two
        // identical checkboxes, both getting pre-checked, and the same
        // bait name would be recorded twice against the catch.
        var seenNames = new Set();

        (allData[cat]||[]).forEach(function(i){

            var name = (i.name || '').trim();
            if (!name) return;

            var nameKey = name.toLowerCase();
            if (seenNames.has(nameKey)) return;
            seenNames.add(nameKey);

            var checked = preselectedNames.indexOf(nameKey) !== -1;

            div.innerHTML+=
                '<label>'+
                '<input type="checkbox" class="baitCheck"' +
                ' data-category="'+cat+'"' +
                ' value="' + encodeURIComponent(name) + '"' +
                (checked?" checked":"")+
                '> '+
                escapeHtml(name)+
                '</label>';

        });

        container.appendChild(div);

    });

}
/**
 * Submit handler for the Record Catch form: gathers the form fields and
 * checked bait items, then saves the catch to the server.
 * @param {SubmitEvent} e - Form submit event.
 * @return {void}
 */
function saveCatch(e){

    e.preventDefault();

    var submitBtn = e.target.querySelector('button[type="submit"]');
    setButtonBusy(submitBtn);

    var data={

        fishType:
            document.getElementById("catchFishType").value,

        weight:
            document.getElementById("catchWeight").value,

        owner:
            document.getElementById("catchOwner").value,

        date:
            document.getElementById("catchDate").value,

        where:
            document.getElementById("catchVenue").value==="__other__"
                ?document.getElementById("otherVenue").value
                :document.getElementById("catchVenue").value,

        dips:[],
        sprays:[],
        corn:[],
        floats:[],
        dough:[],

        existingPhotoFileId: currentEditingCatchPhotoFileId,
        removePhoto: catchPhotoMarkedForRemoval

    };
    var categoryToField = {
    Dips: "dips",
    Sprays: "sprays",
    Corn: "corn",
    Floats: "floats",
    Dough: "dough"
  };

    var seenPerField = {};

    document
        .querySelectorAll(".baitCheck:checked")
        .forEach(function(checkbox){
            var field = categoryToField[checkbox.dataset.category];
            var name = decodeURIComponent(checkbox.value);
            var key = name.toLowerCase();

            if (!seenPerField[field]) seenPerField[field] = new Set();
            if (seenPerField[field].has(key)) return; // avoid recording the same bait twice
            seenPerField[field].add(key);

            data[field].push(name);
        });

    var isEditing = currentEditingCatchRowIndex !== null;
    var selectedPhoto = document.getElementById("catchPhotoInput").files[0];

    var photoReady = selectedPhoto
        ? downscaleImageToBase64_(selectedPhoto, 1600, 0.8)
        : Promise.resolve(null);

    photoReady
        .then(function (photo) {

            if (photo) {
                data.photoBase64 = photo.base64;
                data.photoMimeType = photo.mimeType;
                data.photoName = selectedPhoto.name || 'catch.jpg';
            }

            var request = google.script.run
                .withSuccessHandler(function(){

                    clearButtonBusy(submitBtn);
                    closeRecordCatchModal();

                    loadEverything();

                })
                .withFailureHandler(function (err) {
                    clearButtonBusy(submitBtn);
                    showInfoModal(err.message || String(err), isEditing ? 'Could not save changes' : 'Could not save catch');
                });

            if (isEditing) {
                request.updateFishCatch(currentEditingCatchRowIndex, data);
            } else {
                request.saveFishCatch(data);
            }

        })
        .catch(function (err) {
            clearButtonBusy(submitBtn);
            showInfoModal(err.message || String(err), 'Could not process photo');
        });

}
/**
 * Reads an image file, scales it down (preserving aspect ratio) so its
 * longest side is at most maxDimension, and re-encodes it as a JPEG data
 * URL — this keeps phone-camera photos (often several MB) well within
 * what google.script.run can comfortably send in one call.
 * @param {File} file - The selected image file.
 * @param {number} maxDimension - Maximum width/height, in pixels.
 * @param {number} quality - JPEG quality, 0-1.
 * @return {Promise<{base64: string, mimeType: string}>}
 */
function downscaleImageToBase64_(file, maxDimension, quality) {
    return new Promise(function (resolve, reject) {

        var reader = new FileReader();

        reader.onerror = function () {
            reject(new Error('Could not read the selected photo.'));
        };

        reader.onload = function () {

            var image = new Image();

            image.onerror = function () {
                reject(new Error('Could not read the selected photo.'));
            };

            image.onload = function () {

                var scale = Math.min(1, maxDimension / Math.max(image.width, image.height));
                var scaledWidth = Math.round(image.width * scale);
                var scaledHeight = Math.round(image.height * scale);

                var canvas = document.createElement('canvas');
                canvas.width = scaledWidth;
                canvas.height = scaledHeight;
                canvas.getContext('2d').drawImage(image, 0, 0, scaledWidth, scaledHeight);

                resolve({
                    base64: canvas.toDataURL('image/jpeg', quality).split(',')[1],
                    mimeType: 'image/jpeg'
                });

            };

            image.src = reader.result;

        };

        reader.readAsDataURL(file);

    });
}

  /**
   * Builds the HTML for a list of catch entries (used by the "caught with
   * this" modal and the Bait &rarr; Fish lookup panel), highlighting which
   * combo entry matches the item being looked up, if given.
   * @param {Array<Object>} catches - Catch entries from the fish catch index.
   * @param {string} [category] - Category of the item being looked up, for combo highlighting.
   * @param {string} [itemName] - Name of the item being looked up, for combo highlighting.
   * @return {string} HTML markup.
   */
  function buildCatchEntriesHtml(catches, category, itemName) {
    if (!catches || !catches.length) {
      return '<div class="empty-state">No catches on record for this item.</div>';
    }

    return catches.map(function (catchEntry) {
      var weightText = (catchEntry.weight !== '' && catchEntry.weight !== null && catchEntry.weight !== undefined)
        ? catchEntry.weight + ' kg' : '';
      var comboLines = CATEGORIES.map(function (cat) {
        if (!catchEntry.combo[cat] || !catchEntry.combo[cat].length) return '';
        var isCurrent = cat === category && catchEntry.combo[cat].some(function (name) {
          return name.toLowerCase() === (itemName || '').toLowerCase();
        });
        return '<div class="combo-row' + (isCurrent ? ' is-current' : '') + '">' +
          '<strong>' + escapeHtml(cat) + ':</strong> ' + escapeHtml(catchEntry.combo[cat].join(', ')) +
          '</div>';
      }).join('');

      var photoHtml = catchEntry.photoUrl
        ? '<a href="' + escapeHtml(catchEntry.photoUrl) + '" target="_blank" rel="noopener">' +
          '<img class="catch-photo-thumb" src="' + escapeHtml(catchEntry.photoUrl) + '" alt="Catch photo"></a>'
        : '';

      return '<div class="catch-entry">' +
        '<div class="catch-entry-head">' +
        '<span>' + escapeHtml(catchEntry.fishType || 'Unknown fish') + '</span>' +
        (weightText ? '<span class="catch-entry-weight">' + escapeHtml(weightText) + '</span>' : '') +
        '</div>' +
        '<div><strong>Location:</strong> ' + escapeHtml(catchEntry.where || '-') + '</div>' +
        '<div><strong>Date:</strong> ' + escapeHtml(catchEntry.date || '-') + '</div>' +
        '<div><strong>Caught By:</strong> ' + escapeHtml(catchEntry.owner || '-') + '</div>' +
        comboLines +
        photoHtml +
        '</div>';
    }).join('');
  }

  /**
   * Wires up the Lookup tab's venue/fish select controls, once, on page load.
   * @return {void}
   */
  function setupLookupTab() {
    document.getElementById('lookupVenueSelect').addEventListener('change', renderLookupVenueResults);

  /**
   * Rebuilds the Lookup tab's venue and fish type select options from the
   * latest validations, preserving current selections if still valid.
   * @return {void}
   */
  function populateLookupSelects() {
    if (!validations) return;

    var venueSelect = document.getElementById('lookupVenueSelect');
    if (venueSelect) {
      var previousVenue = venueSelect.value;
      while (venueSelect.options.length > 1) venueSelect.remove(1);

      (validations.venues || []).forEach(function (venue) {
        var opt = document.createElement('option');
        opt.value = venue;
        opt.textContent = venue;
        venueSelect.appendChild(opt);
      });

      var stillValidVenue = Array.prototype.some.call(venueSelect.options, function (o) {
        return o.value === previousVenue;
      });
      venueSelect.value = stillValidVenue ? previousVenue : '';
    }

    var fishSelect = document.getElementById('lookupFishSelect');
    if (fishSelect) {
      var previousFish = fishSelect.value;
      while (fishSelect.options.length > 1) fishSelect.remove(1);

      (validations.fishTypes || []).forEach(function (type) {
        var opt = document.createElement('option');
        opt.value = type;
        opt.textContent = type;
        fishSelect.appendChild(opt);
      });

      var stillValidFish = Array.prototype.some.call(fishSelect.options, function (o) {
        return o.value === previousFish;
      });
      fishSelect.value = stillValidFish ? previousFish : '';
    }
  }

  /**
   * Renders the Venue &rarr; Bait/Gear lookup panel for the currently
   * selected venue: its top bait/gear items and top fish types, derived
   * client-side from the already-loaded fishCatches.
   * @return {void}
   */
  function renderLookupVenueResults() {
    var select = document.getElementById('lookupVenueSelect');
    var container = document.getElementById('lookupVenueResults');
    if (!select.value) {
      container.innerHTML = '';
      return;
    }

    var venue = select.value;
    var matches = (Array.isArray(fishCatches) ? fishCatches : []).filter(function (c) {
      return (c.where || '').trim().toLowerCase() === venue.trim().toLowerCase();
    });

    if (!matches.length) {
      container.innerHTML = '<div class="empty-state">No catches on record for this venue.</div>';
      return;
    }

    var baitCounts = {};   // "category|name" -> {category, name, count}
    var fishCounts = {};   // fishType -> count
    var totalWeight = 0, weighedCount = 0;

    matches.forEach(function (c) {
      var fishType = c.fishType || 'Unknown';
      fishCounts[fishType] = (fishCounts[fishType] || 0) + 1;

      var w = Number(c.weight) || 0;
      if (w > 0) { totalWeight += w; weighedCount++; }

      CATEGORIES.forEach(function (cat) {
        (c[cat.toLowerCase()] || []).forEach(function (rawName) {
          var name = String(rawName || '').trim();
          if (!name) return;
          var key = cat + '|' + name.toLowerCase();
          if (!baitCounts[key]) baitCounts[key] = { category: cat, name: name, count: 0 };
          baitCounts[key].count++;
        });
      });
    });

    var topBaits = Object.keys(baitCounts).map(function (k) { return baitCounts[k]; })
      .sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name); })
      .slice(0, 5);

    var topFish = Object.keys(fishCounts).map(function (f) { return { fishType: f, count: fishCounts[f] }; })
      .sort(function (a, b) { return b.count - a.count || a.fishType.localeCompare(b.fishType); })
      .slice(0, 5);

    var avgWeight = weighedCount ? (totalWeight / weighedCount) : 0;

    var html = '<p class="hint">' + matches.length + ' catch' + (matches.length === 1 ? '' : 'es') +
      (avgWeight ? ' &middot; ' + avgWeight.toFixed(2) + ' kg avg' : '') + '</p>';

    if (topBaits.length) {
      html += '<div class="stats-section"><h4>Top Bait / Gear</h4><div class="stats-list">' +
        topBaits.map(function (b, i) {
          return '<div class="stats-list-item"><span><span class="rank">#' + (i + 1) + '</span>' +
            escapeHtml(b.name) + ' (' + escapeHtml(b.category) + ')</span><span>' + b.count + '</span></div>';
        }).join('') + '</div></div>';
    }

    if (topFish.length) {
      html += '<div class="stats-section"><h4>Top Fish Caught</h4><div class="stats-list">' +
        topFish.map(function (f) {
          return '<div class="stats-list-item"><span>' + escapeHtml(f.fishType) + '</span><span>' +
            f.count + ' catch' + (f.count === 1 ? '' : 'es') + '</span></div>';
        }).join('') + '</div></div>';
    }

    container.innerHTML = html;
  }

  /**
   * Fetches the owner x category summary from the server and renders the
   * Compare tab's table.
   * @return {void}
   */
  function renderCompare() {
    google.script.run
      .withSuccessHandler(function (summary) {
        drawCompareTable(summary);
      })
      .withFailureHandler(function (err) {
        document.getElementById('compareTable').innerHTML =
          '<div class="empty-state">Could not load summary: ' + escapeHtml(err.message || err) + '</div>';
      })
      .getSummary();
  }

  /**
   * Renders the Compare tab's owner x category table, highlighting the
   * leading owner(s) per category and overall total.
   * @param {Object} summary - Result of getSummary(): {owners, categories, counts, totals}.
   * @return {void}
   */
  function drawCompareTable(summary) {
    var container = document.getElementById('compareTable');

    // getSummary() reads the raw sheets, so it doesn't know about
    // Validations-based deletions — drop any owner no longer in the
    // Owners list here, same soft-delete behavior as everywhere else.
    var visibleOwners = validations
      ? summary.owners.filter(function (owner) { return isKnownOrBlank(validations.owners, owner); })
      : summary.owners;

    // Respect the Stats tab's owner filter too, so this table only shows
    // the selected owner (if any) alongside the rest of the Stats tab.
    var ownerFilter = getStatsOwnerFilter();
    if (ownerFilter !== '__all__') {
      visibleOwners = visibleOwners.filter(function (owner) { return owner === ownerFilter; });
    }

    summary = Object.assign({}, summary, { owners: visibleOwners });

    if (!summary.owners.length) {
      container.innerHTML = '<div class="empty-state">No data yet.</div>';
      return;
    }

    // For each category, find the highest count and which owner(s) hold it
    // (ties share the highlight). A count of 0 is never a "leader".
    var leaders = {}; // category -> Set of owner names tied for the max
    summary.categories.forEach(function (cat) {
      var max = 0;
      summary.owners.forEach(function (owner) {
        var c = (summary.counts[owner] && summary.counts[owner][cat]) || 0;
        if (c > max) max = c;
      });
      leaders[cat] = new Set();
      if (max > 0) {
        summary.owners.forEach(function (owner) {
          var c = (summary.counts[owner] && summary.counts[owner][cat]) || 0;
          if (c === max) leaders[cat].add(owner);
        });
      }
    });

    // Same idea for the Total column.
    var maxTotal = 0;
    summary.owners.forEach(function (owner) {
      if ((summary.totals[owner] || 0) > maxTotal) maxTotal = summary.totals[owner] || 0;
    });
    var totalLeaders = new Set();
    if (maxTotal > 0) {
      summary.owners.forEach(function (owner) {
        if ((summary.totals[owner] || 0) === maxTotal) totalLeaders.add(owner);
      });
    }

    var headRow = '<th>Owner</th>' + summary.categories.map(function (cat) {
      return '<th>' + escapeHtml(cat) + '</th>';
    }).join('') + '<th>Total</th>';

    var bodyRows = summary.owners.map(function (owner) {
      var cells = summary.categories.map(function (cat) {
        var count = (summary.counts[owner] && summary.counts[owner][cat]) || 0;
        var isLeader = leaders[cat].has(owner);
        return '<td class="' + (isLeader ? 'cell-leader' : '') + '" data-label="' + escapeHtml(cat) + '">' +
          count + (isLeader ? ' <span class="crown" title="Most ' + escapeHtml(cat) + '">&#9819;</span>' : '') +
          '</td>';
      }).join('');
      var total = summary.totals[owner] || 0;
      var isTotalLeader = totalLeaders.has(owner);
      return '<tr><td data-label="Owner">' + escapeHtml(owner) + '</td>' + cells +
        '<td class="' + (isTotalLeader ? 'cell-leader' : '') + '" data-label="Total">' + total +
        (isTotalLeader ? ' <span class="crown" title="Most overall">&#9819;</span>' : '') +
        '</td></tr>';
    }).join('');

    var totalsRow = '<td data-label="Owner">Category total</td>' + summary.categories.map(function (cat) {
      var total = summary.owners.reduce(function (sum, owner) {
        return sum + ((summary.counts[owner] && summary.counts[owner][cat]) || 0);
      }, 0);
      return '<td data-label="' + escapeHtml(cat) + '">' + total + '</td>';
    }).join('') + '<td data-label="Total">' + Object.values(summary.totals).reduce(function (a, b) { return a + b; }, 0) + '</td>';

    container.innerHTML = '<table class="compare-table">' +
      '<thead><tr>' + headRow + '</tr></thead>' +
      '<tbody>' + bodyRows + '</tbody>' +
      '<tfoot><tr>' + totalsRow + '</tr></tfoot>' +
      '</table>';
  }

  // ---------- STATS TAB EXTRAS ----------
  // These are computed entirely client-side from data already loaded
  // (allData, fishCatches, fishIndex), so no extra server round-trip.

  /**
   * Derives all Stats tab figures client-side from the already-loaded
   * allData/fishCatches/fishIndex, without an extra server round-trip.
   * @return {?Object} Stats object, or null if allData hasn't loaded yet.
   */
  function computeStats() {
    if (!allData) return null;

    var ownerFilter = getStatsOwnerFilter();

    var totalItems = 0;
    var usedUpCount = 0;
    var brandCounts = {};        // brand -> total item count
    var ownerBrandCounts = {};   // owner -> { brand -> count }

    CATEGORIES.forEach(function (cat) {
      var items = allData[cat] || [];
      if (ownerFilter !== '__all__') {
        items = items.filter(function (it) { return it.owner === ownerFilter; });
      }
      items.forEach(function (it) {
        totalItems++;
        if (it.usedUp) usedUpCount++;

        var brand = (it.brand || '').trim();
        if (!brand) return;

        brandCounts[brand] = (brandCounts[brand] || 0) + 1;

        var owner = it.owner || 'Unknown';
        if (!ownerBrandCounts[owner]) ownerBrandCounts[owner] = {};
        ownerBrandCounts[owner][brand] = (ownerBrandCounts[owner][brand] || 0) + 1;
      });
    });

    // Most-used brand per owner (ties broken by whichever brand sorts
    // first — rare enough not to worry about surfacing both).
    var topBrandByOwner = {};
    Object.keys(ownerBrandCounts).forEach(function (owner) {
      var brands = ownerBrandCounts[owner];
      var best = null, bestCount = 0;
      Object.keys(brands).sort().forEach(function (b) {
        if (brands[b] > bestCount) { best = b; bestCount = brands[b]; }
      });
      if (best) topBrandByOwner[owner] = { brand: best, count: bestCount };
    });

    // Top 5 brands overall by total item count.
    var topBrandsOverall = Object.keys(brandCounts)
      .map(function (b) { return { brand: b, count: brandCounts[b] }; })
      .sort(function (a, b) { return b.count - a.count || a.brand.localeCompare(b.brand); })
      .slice(0, 5);

    // Fish-catch derived stats.
    var catches = Array.isArray(fishCatches) ? fishCatches : [];
    if (ownerFilter !== '__all__') {
      catches = catches.filter(function (c) { return c.owner === ownerFilter; });
    }
    var totalFish = catches.length;
    var totalWeight = 0, weighedCount = 0, heaviest = null;
    var ownerCatchCounts = {};
    var ownerWeightTotals = {}; // owner -> {total, weighedCount}
    var personalBests = {};   // owner -> {weight, fishType, where, date}
    var venueStats = {};      // venue -> {count, totalWeight, weighedCount, heaviest}

    catches.forEach(function (c) {
      var w = Number(c.weight) || 0;
      var owner = c.owner || 'Unknown';
      var venue = c.where || 'Unknown';

      ownerCatchCounts[owner] = (ownerCatchCounts[owner] || 0) + 1;

      if (!venueStats[venue]) {
        venueStats[venue] = { count: 0, totalWeight: 0, weighedCount: 0, heaviest: null, baitCounts: {} };
      }
      venueStats[venue].count++;

      // Tally every bait/gear item used in this catch (regardless of
      // whether a weight was recorded) so we can surface the top bait
      // per venue below.
      CATEGORIES.forEach(function (cat) {
        var used = c[cat.toLowerCase()] || [];
        used.forEach(function (name) {
          name = String(name || '').trim();
          if (!name) return;
          var key = cat + '|' + name.toLowerCase();
          if (!venueStats[venue].baitCounts[key]) {
            venueStats[venue].baitCounts[key] = { category: cat, name: name, count: 0 };
          }
          venueStats[venue].baitCounts[key].count++;
        });
      });

      if (w > 0) {
        totalWeight += w;
        weighedCount++;
        if (!heaviest || w > heaviest.weight) {
          heaviest = { weight: w, fishType: c.fishType, owner: owner, where: venue };
        }

        if (!personalBests[owner] || w > personalBests[owner].weight) {
          personalBests[owner] = { weight: w, fishType: c.fishType, where: venue, date: c.date };
        }

        if (!ownerWeightTotals[owner]) ownerWeightTotals[owner] = { total: 0, weighedCount: 0 };
        ownerWeightTotals[owner].total += w;
        ownerWeightTotals[owner].weighedCount++;

        venueStats[venue].totalWeight += w;
        venueStats[venue].weighedCount++;
        if (!venueStats[venue].heaviest || w > venueStats[venue].heaviest.weight) {
          venueStats[venue].heaviest = { weight: w, fishType: c.fishType, owner: owner };
        }
      }
    });

    var avgWeight = weighedCount ? (totalWeight / weighedCount) : 0;

    // Venue with the most catches logged.
    var topVenueName = null;
    Object.keys(venueStats).forEach(function (v) {
      if (!topVenueName || venueStats[v].count > venueStats[topVenueName].count) {
        topVenueName = v;
      }
    });

    // Resolve each venue's top bait/gear combo from the counts tallied
    // above, then drop the raw counts map (only the winner is needed
    // by the UI).
    Object.keys(venueStats).forEach(function (v) {
      var counts = venueStats[v].baitCounts;
      var best = null;
      Object.keys(counts).sort().forEach(function (k) {
        if (!best || counts[k].count > best.count) best = counts[k];
      });
      venueStats[v].topBait = best;
      delete venueStats[v].baitCounts;
    });

    // Per-angler breakdown: catches logged, average weight, and personal
    // best, one entry per owner who has logged at least one catch — shown
    // as its own list on the Stats tab rather than crowning a single
    // overall "top angler"/"biggest fish" winner.
    var ownerFishStats = {};
    Object.keys(ownerCatchCounts).forEach(function (owner) {
      var wt = ownerWeightTotals[owner] || { total: 0, weighedCount: 0 };
      ownerFishStats[owner] = {
        count: ownerCatchCounts[owner],
        avgWeight: wt.weighedCount ? (wt.total / wt.weighedCount) : 0,
        heaviest: personalBests[owner] || null
      };
    });

    // "MVP bait": the single inventory item (any category) linked to the
    // most catches, using the fish index already loaded for the icons.
    // fishIndex covers every catch regardless of the owner filter, so its
    // per-item catch lists are filtered down to the selected owner here.
    var mvpBait = null;
    if (fishIndex) {
      CATEGORIES.forEach(function (cat) {
        var catIdx = fishIndex[cat] || {};
        var itemsInCat = allData[cat] || [];
        Object.keys(catIdx).forEach(function (nameLower) {
          var itemCatches = catIdx[nameLower] || [];
          if (ownerFilter !== '__all__') {
            itemCatches = itemCatches.filter(function (c) { return c.owner === ownerFilter; });
          }
          var count = itemCatches.length;
          if (!count) return;
          if (!mvpBait || count > mvpBait.count) {
            var match = itemsInCat.find(function (it) {
              return it.name.trim().toLowerCase() === nameLower;
            });
            mvpBait = {
              category: cat,
              name: match ? match.name : nameLower,
              count: count
            };
          }
        });
      });
    }

    return {
      totalItems: totalItems,
      usedUpCount: usedUpCount,
      distinctBrands: Object.keys(brandCounts).length,
      topBrandByOwner: topBrandByOwner,
      topBrandsOverall: topBrandsOverall,
      totalFish: totalFish,
      avgWeight: avgWeight,
      heaviest: heaviest,
      mvpBait: mvpBait,
      ownerFishStats: ownerFishStats,
      venueStats: venueStats,
      topVenueName: topVenueName
    };
  }

  /**
   * Builds the HTML for one stat tile on the Stats tab.
   * @param {string|number} value - The stat's value.
   * @param {string} label - The stat's label.
   * @return {string} HTML markup for the stat card.
   */
  function statCard(value, label) {
    return '<div class="stat-card"><div class="stat-value">' + escapeHtml(String(value)) + '</div>' +
      '<div class="stat-label">' + escapeHtml(label) + '</div></div>';
  }

  /**
   * Builds one User Stats card: an angler's personal best first, then
   * their catch count and average weight.
   * @param {string} owner - Angler name.
   * @param {Object} stats - One entry from computeStats()'s ownerFishStats: {count, avgWeight, heaviest}.
   * @return {string} HTML markup for the card.
   */
  function buildUserStatCard(owner, stats) {
    var personalBestHtml;

    if (stats.heaviest) {
      var pb = stats.heaviest;
      var pbDetails = [];
      if (pb.fishType) pbDetails.push(escapeHtml(pb.fishType));
      if (pb.where) pbDetails.push(escapeHtml(pb.where));

      personalBestHtml =
        '<div class="user-stat-pb">' +
        '<span class="user-stat-pb-value">' + pb.weight + ' kg</span>' +
        '<span class="user-stat-pb-label">Personal Best' +
        (pbDetails.length ? ' — ' + pbDetails.join(' @ ') : '') +
        '</span>' +
        '</div>';
    } else {
      personalBestHtml = '<div class="user-stat-pb user-stat-pb-empty">No weighed catches yet</div>';
    }

    var catchLabel = stats.count === 1 ? 'catch' : 'catches';
    var catchBadgeHtml = '<span class="badge">🎣 ' + stats.count + ' ' + catchLabel + '</span>';

    var avgWeightHtml = stats.avgWeight
      ? '<div class="user-stat-meta">Avg weight: ' + stats.avgWeight.toFixed(2) + ' kg</div>'
      : '';

    return (
      '<div class="user-stat-card">' +
      '<div class="user-stat-header"><h5>' + escapeHtml(owner) + '</h5>' + catchBadgeHtml + '</div>' +
      personalBestHtml +
      avgWeightHtml +
      '</div>'
    );
  }

  /**
   * Builds the User Stats section: one card per angler, ranked by
   * personal-best weight (anglers with no weighed catch sort last).
   * @param {Object} s - computeStats() result.
   * @return {string} HTML markup, or '' if no angler has logged a catch.
   */
  function buildUserStatsHtml(s) {
    var owners = Object.keys(s.ownerFishStats);
    if (!owners.length) return '';

    owners.sort(function (a, b) {
      var weightA = s.ownerFishStats[a].heaviest ? s.ownerFishStats[a].heaviest.weight : -1;
      var weightB = s.ownerFishStats[b].heaviest ? s.ownerFishStats[b].heaviest.weight : -1;
      if (weightA !== weightB) return weightB - weightA;
      return a.localeCompare(b);
    });

    var cardsHtml = owners
      .map(function (owner) { return buildUserStatCard(owner, s.ownerFishStats[owner]); })
      .join('');

    return '<div class="stats-section"><h4>User Stats</h4>' +
      '<div class="user-stats-grid">' + cardsHtml + '</div></div>';
  }

  /**
   * Builds the overall stat-card grid (Total Items, Brands, Needs Restock,
   * Fish Caught, Avg. Fish Weight, Heaviest Fish).
   * @param {Object} s - computeStats() result.
   * @return {string} HTML markup.
   */
  function buildStatCardsHtml(s) {
    var cards = [
      statCard(s.totalItems, 'Total Items'),
      statCard(s.distinctBrands, 'Brands'),
      statCard(s.usedUpCount, 'Needs Restock'),
      statCard(s.totalFish, 'Fish Caught')
    ];
    if (s.avgWeight) cards.push(statCard(s.avgWeight.toFixed(2) + ' kg', 'Avg. Fish Weight'));
    if (s.heaviest) cards.push(statCard(s.heaviest.weight + ' kg', 'Heaviest Fish'));

    return '<div class="stat-grid">' + cards.join('') + '</div>';
  }

  /**
   * Builds the "Most-Used Brand per Owner" section.
   * @param {Object} s - computeStats() result.
   * @return {string} HTML markup, or '' if there's nothing to show.
   */
  function buildTopBrandByOwnerHtml(s) {
    var rows = Object.keys(s.topBrandByOwner).sort().map(function (owner) {
      var info = s.topBrandByOwner[owner];
      return '<div class="stats-list-item"><span>' + escapeHtml(owner) + '</span>' +
        '<span><strong>' + escapeHtml(info.brand) + '</strong> &middot; ' +
        info.count + ' item' + (info.count === 1 ? '' : 's') + '</span></div>';
    }).join('');

    if (!rows) return '';
    return '<div class="stats-section"><h4>Most-Used Brand per Owner</h4>' +
      '<div class="stats-list">' + rows + '</div></div>';
  }

  /**
   * Builds the "Top Brands Overall" section.
   * @param {Object} s - computeStats() result.
   * @return {string} HTML markup, or '' if there's nothing to show.
   */
  function buildTopBrandsOverallHtml(s) {
    var rows = s.topBrandsOverall.map(function (b, i) {
      return '<div class="stats-list-item"><span><span class="rank">#' + (i + 1) + '</span>' +
        escapeHtml(b.brand) + '</span><span>' + b.count + ' item' + (b.count === 1 ? '' : 's') + '</span></div>';
    }).join('');

    if (!rows) return '';
    return '<div class="stats-section"><h4>Top Brands Overall</h4>' +
      '<div class="stats-list">' + rows + '</div></div>';
  }

  /**
   * Builds the "Venue Statistics" section.
   * @param {Object} s - computeStats() result.
   * @return {string} HTML markup, or '' if there's nothing to show.
   */
  function buildVenueStatsHtml(s) {
    var venues = Object.keys(s.venueStats).sort(function (a, b) {
      return s.venueStats[b].count - s.venueStats[a].count;
    });

    var rows = venues.map(function (venue) {
      var vs = s.venueStats[venue];
      var bits = [vs.count + ' catch' + (vs.count === 1 ? '' : 'es')];
      if (vs.weighedCount) bits.push((vs.totalWeight / vs.weighedCount).toFixed(2) + ' kg avg');
      if (vs.heaviest) bits.push('best ' + vs.heaviest.weight + ' kg');
      if (vs.topBait) bits.push('top bait: ' + escapeHtml(vs.topBait.name) + ' (' + vs.topBait.category + ')');
      return '<div class="stats-list-item"><span>' + escapeHtml(venue) + '</span>' +
        '<span>' + bits.join(' &middot; ') + '</span></div>';
    }).join('');

    if (!rows) return '';
    return '<div class="stats-section"><h4>Venue Statistics</h4>' +
      '<div class="stats-list">' + rows + '</div></div>';
  }

  /**
   * Builds the closing highlight notes: MVP bait, biggest fish so far, and
   * the most productive venue.
   * @param {Object} s - computeStats() result.
   * @return {string} HTML markup, or '' if there's nothing to show.
   */
  function buildHighlightNotesHtml(s) {
    var notes = [];

    if (s.mvpBait) {
      notes.push('<p class="stats-note">🏆 MVP bait: <span class="stats-highlight">' +
        escapeHtml(s.mvpBait.name) + '</span> (' + escapeHtml(s.mvpBait.category) + ') has landed ' +
        s.mvpBait.count + ' fish so far.</p>');
    }

    if (s.heaviest) {
      notes.push('<p class="stats-note">Biggest fish so far: <span class="stats-highlight">' +
        escapeHtml(s.heaviest.fishType || 'Unknown') + '</span> at ' + s.heaviest.weight + ' kg, caught by ' +
        escapeHtml(s.heaviest.owner || 'Unknown') +
        (s.heaviest.where ? ' at ' + escapeHtml(s.heaviest.where) : '') + '.</p>');
    }

    if (s.topVenueName) {
      var topVenueCatchCount = s.venueStats[s.topVenueName].count;
      notes.push('<p class="stats-note">🗺️ Most productive venue: <span class="stats-highlight">' +
        escapeHtml(s.topVenueName) + '</span> with ' + topVenueCatchCount + ' catch' +
        (topVenueCatchCount === 1 ? '' : 'es') + ' logged.</p>');
    }

    if (!notes.length) return '';
    return '<div class="stats-section">' + notes.join('') + '</div>';
  }

  /**
   * Renders the Stats tab into its three containers, in page order:
   * User Stats, then the overall stat-card grid, then (further down the
   * page, around the owner x category compare table) the brand/venue
   * breakdowns and highlight notes.
   * @return {void}
   */
  function renderStats() {
    if (!allData) return;

    var userStatsEl = document.getElementById('userStats');
    var statsCardsEl = document.getElementById('statsCards');
    var statsExtrasEl = document.getElementById('statsExtras');
    if (!userStatsEl || !statsCardsEl || !statsExtrasEl) return;

    var s = computeStats();
    var hasAnyData = s.totalItems > 0 || s.totalFish > 0;

    if (!hasAnyData) {
      var ownerFilter = getStatsOwnerFilter();
      var emptyMessage = ownerFilter === '__all__'
        ? 'Add some gear or log a catch to see stats here.'
        : escapeHtml(ownerFilter) + ' has no gear or catches on record yet.';
      userStatsEl.innerHTML = '<div class="empty-state">' + emptyMessage + '</div>';
      statsCardsEl.innerHTML = '';
      statsExtrasEl.innerHTML = '';
      return;
    }

    userStatsEl.innerHTML = buildUserStatsHtml(s);
    statsCardsEl.innerHTML = buildStatCardsHtml(s);
    statsExtrasEl.innerHTML =
      buildTopBrandByOwnerHtml(s) +
      buildTopBrandsOverallHtml(s) +
      buildVenueStatsHtml(s) +
      buildHighlightNotesHtml(s);
  }
